name: Windows checks and installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: md0-windows-x64
          path: dist/md0-Setup-*.exe
          if-no-files-found: error
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
